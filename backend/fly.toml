# Production backend on Fly.io (Toronto). Deploy from backend/: ~/.fly/bin/flyctl deploy --ha=false
# Secrets (API keys, Google and Plaid credentials, SESSION_SECRET, TOKEN_ENCRYPTION_KEY,
# ALLOWED_EMAILS, PLAID_ALLOWED_EMAILS) live in Fly's secret manager, never in this file.

app = "loonietoonie-tracker-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  FRONTEND_URL = "https://app.loonietoonietracker.com"
  # https://localhost is the Android app's WebView.
  FRONTEND_ORIGINS = '["https://app.loonietoonietracker.com","https://localhost"]'
  GOOGLE_REDIRECT_URI = "https://api.loonietoonietracker.com/api/auth/callback"
  PLAID_ENV = "production"
  TOKEN_STORE_PATH = "/app/data/tokens.sqlite3"

# Encrypted Plaid token store. Back it up (fly volumes snapshots) and keep TOKEN_ENCRYPTION_KEY
# separately: losing the key means relinking every bank.
[mounts]
  source = "tokens"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine that stays up: the sync lock, migrate_once, the read cache and the daily Claude
  # limits live in process memory (spec §12).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
